name: Postman Tests
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run Postman collection
        run: npm run test
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman/
          retention-days: 30